# Profil de test : base H2 en memoire compatible MySQL, sans dependre de XAMPP.
spring.datasource.url=jdbc:h2:mem:jwt_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER,ROLE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

jwt.secret=MySuperSecretKeyForJwtAuthentication123456
jwt.expiration=3600000